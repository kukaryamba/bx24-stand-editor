# Сборка приложения для хостинга Таймвеб.
#
# Раньше GitHub сам заливал файлы на хостинг по SSH, но хостинг не принимает
# SSH-подключения с серверов GitHub: заливка падала по таймауту. Поэтому
# направление обратное — GitHub кладёт готовую сборку в ветку deploy,
# а хостинг раз в несколько минут сам забирает её скриптом
# deploy/timeweb-pull.sh. Исходящие соединения с хостинга до GitHub работают.
name: Сборка для Таймвеба

on:
  push:
    branches: [main]
  workflow_dispatch:

# Нужно, чтобы записать собранные файлы в ветку deploy.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      - name: Точка входа под POST
        # Битрикс24 открывает приложение POST-запросом, а nginx отдаёт статику
        # только на GET и отвечает 405. PHP принимает любой метод, поэтому
        # входная страница переименовывается. Кода внутри нет, это тот же HTML.
        run: mv dist/index.html dist/index.php

      - name: Сборка в ветку deploy
        # В ветке только готовые файлы и ничего больше: хостинг забирает её
        # целиком. История не нужна — каждый раз ветка пишется заново.
        run: |
          cd dist
          git init --quiet
          git checkout --quiet -b deploy
          git add --all
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit --quiet -m "Сборка ${GITHUB_SHA::7}"
          git push --quiet --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
