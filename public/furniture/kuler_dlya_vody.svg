<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Кулер для воды, вид сверху</title>
  <!-- Корпус: квадрат 50 x 50 см, как у остальных обозначений — вид сверху. -->
  <rect x="6" y="6" width="88" height="88" rx="4" fill="#f7f8fa" stroke="#5b6674" stroke-width="3"/>
  <!-- Бутыль сверху видна кругом. -->
  <circle cx="50" cy="50" r="26" fill="#dceaf6" stroke="#5b6674" stroke-width="3"/>
  <!-- Капля — чтобы обозначение читалось без подписи. -->
  <path d="M50 33 C50 33 62 47 62 55 a12 12 0 0 1 -24 0 C38 47 50 33 50 33 Z" fill="#ffffff" stroke="#5b6674" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Кран со стороны подхода. -->
  <rect x="44" y="82" width="12" height="8" rx="2" fill="#5b6674"/>
</svg>
