  <circle cx="13.6" cy="14.8" r="1.1" fill="#c62828"/>
  <text x="10" y="10.6" font-family="Arial, sans-serif" font-size="5.6" font-weight="bold" fill="#c62828" text-anchor="middle" dominant-baseline="central">16</text>
